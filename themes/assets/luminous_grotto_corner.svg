<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <linearGradient id="grottoCornerStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee5d8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="grottoPetalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#2ee5d8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15"/>
