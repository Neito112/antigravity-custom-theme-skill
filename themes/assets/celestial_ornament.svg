<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 38" fill="none">
  <defs>
    <linearGradient id="orbitGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#e2e8f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="85%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  <!-- Elliptical planetary orbital arcs -->
  <path d="M 6 26 Q 64 6 122 22" stroke="url(#orbitGlow)" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 16 30 Q 64 12 112 25" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6"/>
  <!-- Central miniature eclipse orb with starlight rim -->
  <g transform="translate(64, 18)">
    <circle cx="0" cy="0" r="7.5" fill="url(#planetGrad)" stroke="#38bdf8" stroke-width="0.8"/>
    <ellipse cx="0" cy="0" rx="14" ry="4.2" stroke="#e2e8f0" stroke-width="0.9" transform="rotate(-15)" opacity="0.85"/>
  </g>
  <!-- Diamond star sparkles -->
  <path d="M 22 18 L 23.2 15 L 26 14 L 23.2 13 L 22 10 L 20.8 13 L 18 14 L 20.8 15 Z" fill="#e2e8f0" opacity="0.9"/>
  <path d="M 104 15 L 105 12.8 L 107 12 L 105 11.2 L 104 9 L 103 11.2 L 101 12 L 103 12.8 Z" fill="#38bdf8" opacity="0.85"/>
  <circle cx="38" cy="14" r="1.2" fill="#ffffff" opacity="0.75"/>
  <circle cx="90" cy="22" r="1.1" fill="#7dd3fc" opacity="0.8"/>
</svg>
