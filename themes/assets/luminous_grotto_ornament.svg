<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 38" fill="none">
  <defs>
    <linearGradient id="grottoStreamArc" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#2ee5d8" stop-opacity="0.88"/>
      <stop offset="68%" stop-color="#fde68a" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="lilyPetalGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="65%" stop-color="#2ee5d8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Diagonal sunbeam threads filtering into the cavern -->
  <line x1="42" y1="3" x2="26" y2="33" stroke="#fde68a" stroke-width="1.1" stroke-linecap="round" opacity="0.38"/>
  <line x1="68" y1="2" x2="52" y2="34" stroke="#fde68a" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <line x1="94" y1="4" x2="78" y2="34" stroke="#fde68a" stroke-width="1.0" stroke-linecap="round" opacity="0.35"/>
  <!-- Flowing bioluminescent stream & root arc -->
  <path d="M 6 28 Q 42 15 64 21 T 122 24" stroke="url(#grottoStreamArc)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 16 32 Q 64 18 114 29" stroke="#2ee5d8" stroke-width="0.8" stroke-dasharray="2.5 3.5" opacity="0.62"/>
  <!-- Central glowing crystalline grotto lily -->
  <g transform="translate(64, 19)">
    <!-- Striped bioluminescent stem calyx -->
    <path d="M -2.5 3 L 0 14 L 2.5 3 Z" fill="#6366f1" opacity="0.85"/>
    <line x1="0" y1="4" x2="0" y2="13" stroke="#2ee5d8" stroke-width="0.9"/>
    <!-- Crystalline petals -->
    <path d="M 0 2 L -4 -7 L 0 -12 L 4 -7 Z" fill="url(#lilyPetalGrad)"/>
    <path d="M 0 2 L -11 -3 L -13 -8 L -6 -7 Z" fill="url(#lilyPetalGrad)" opacity="0.92"/>
    <path d="M 0 2 L 11 -3 L 13 -8 L 6 -7 Z" fill="url(#lilyPetalGrad)" opacity="0.92"/>
    <path d="M 0 2 L -9 3 L -12 0 L -6 -1 Z" fill="#2ee5d8" opacity="0.75"/>
    <path d="M 0 2 L 9 3 L 12 0 L 6 -1 Z" fill="#2ee5d8" opacity="0.75"/>
    <!-- Dark stamen dots at petal base -->
    <circle cx="-2" cy="0.5" r="0.85" fill="#071020"/>
    <circle cx="0" cy="-0.3" r="0.85" fill="#071020"/>
    <circle cx="2" cy="0.5" r="0.85" fill="#071020"/>
  </g>
  <!-- Floating bioluminescent magenta & cyan spore clusters -->
  <circle cx="24" cy="18" r="2.1" fill="#2ee5d8" opacity="0.85"/>
  <circle cx="31" cy="13" r="1.2" fill="#ecfeff" opacity="0.9"/>
  <circle cx="96" cy="16" r="2.3" fill="#f472b6" opacity="0.85"/>
  <circle cx="103" cy="20" r="1.4" fill="#c084fc" opacity="0.85"/>
  <circle cx="88" cy="13" r="1.1" fill="#fde68a" opacity="0.85"/>
</svg>